<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Canon Moments - Client Status Portal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #121212;
      --card-bg: #1a1a1a;
      --border-color: #2e2e2e;
      --accent-gold: #d4af37;
      --accent-gold-light: #f3e5ab;
      --text-main: #f5f5f5;
      --text-muted: #a0a0a0;
      --font-serif: 'Cormorant Garamond', Georgia, serif;
      --font-sans: 'Montserrat', sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      font-family: var(--font-sans);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px 15px;
    }

    .container {
      width: 100%;
      max-width: 850px;
    }

    .header {
      text-align: center;
      margin-bottom: 30px;
    }

    .header h1 {
      font-family: var(--font-serif);
      font-size: 2.2rem;
      font-weight: 400;
      letter-spacing: 1.5px;
      margin-bottom: 6px;
      color: var(--text-main);
    }

    .header p {
      color: var(--accent-gold);
      text-transform: uppercase;
      font-size: 0.7rem;
      letter-spacing: 2.5px;
    }

    .search-card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      padding: 20px;
      border-radius: 4px;
      margin-bottom: 25px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }

    .search-card label {
      display: block;
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      color: var(--text-muted);
      margin-bottom: 12px;
    }

    .search-box {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .search-input {
      width: 100%;
      background: #0f0f0f;
      border: 1px solid var(--border-color);
      padding: 14px 16px;
      color: var(--text-main);
      font-family: var(--font-sans);
      font-size: 0.95rem;
      border-radius: 2px;
      outline: none;
      transition: border-color 0.3s;
    }

    .search-input:focus {
      border-color: var(--accent-gold);
    }

    .btn {
      width: 100%;
      background: var(--accent-gold);
      color: #000;
      border: none;
      padding: 14px 20px;
      font-family: var(--font-sans);
      font-weight: 600;
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      cursor: pointer;
      transition: background 0.3s;
      border-radius: 2px;
    }

    .btn:hover {
      background: var(--accent-gold-light);
    }

    .status-card {
      display: none;
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      padding: 25px 20px;
      border-radius: 4px;
      box-shadow: 0 15px 40px rgba(0,0,0,0.6);
      animation: fadeIn 0.4s ease-in-out forwards;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .client-info-header {
      display: flex;
      flex-direction: column;
      gap: 12px;
      align-items: flex-start;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 20px;
      margin-bottom: 25px;
    }

    .client-info-header h2 {
      font-family: var(--font-serif);
      font-size: 1.75rem;
      font-weight: 400;
      line-height: 1.2;
    }

    .client-info-header p {
      color: var(--text-muted);
      font-size: 0.85rem;
      margin-top: 4px;
    }

    .badge {
      display: inline-block;
      padding: 6px 12px;
      border: 1px solid var(--accent-gold);
      color: var(--accent-gold);
      font-size: 0.65rem;
      text-transform: uppercase;
      letter-spacing: 1.5px;
    }

    /* Tracker Steps Desktop & Responsive Layout */
    .tracker-steps {
      display: flex;
      flex-direction: column;
      gap: 20px;
      position: relative;
      margin: 25px 0;
    }

    .tracker-progress-line {
      display: none;
    }

    .step-item {
      display: flex;
      align-items: center;
      gap: 15px;
      position: relative;
      z-index: 3;
    }

    .step-circle {
      width: 32px;
      height: 32px;
      min-width: 32px;
      background: var(--bg-dark);
      border: 2px solid var(--border-color);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.75rem;
      color: var(--text-muted);
      transition: all 0.3s;
    }

    .step-item.active .step-circle {
      border-color: var(--accent-gold);
      background: var(--accent-gold);
      color: #000;
    }

    .step-item.completed .step-circle {
      border-color: var(--accent-gold);
      color: var(--accent-gold);
      background: rgba(212, 175, 55, 0.15);
    }

    .step-title {
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--text-muted);
    }

    .step-item.active .step-title {
      color: var(--accent-gold);
      font-weight: 600;
    }

    .step-item.completed .step-title {
      color: var(--text-main);
    }

    .details-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 15px;
      background: #141414;
      padding: 20px;
      border: 1px solid var(--border-color);
      margin-top: 25px;
    }

    .detail-item h4 {
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      color: var(--text-muted);
      margin-bottom: 6px;
    }

    .detail-item p {
      font-size: 0.9rem;
      color: var(--text-main);
      line-height: 1.4;
    }

    .loader {
      display: none;
      color: var(--accent-gold);
      font-size: 0.8rem;
      margin-top: 12px;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      text-align: center;
    }

    /* Tablet and Desktop Enhancements */
    @media (min-width: 601px) {
      body {
        padding: 40px 20px;
      }

      .header h1 {
        font-size: 2.8rem;
      }

      .header p {
        font-size: 0.75rem;
      }

      .search-card {
        padding: 30px;
      }

      .search-box {
        flex-direction: row;
        gap: 12px;
      }

      .btn {
        width: auto;
        padding: 14px 28px;
      }

      .status-card {
        padding: 40px;
      }

      .client-info-header {
        flex-direction: row;
        justify-content: space-between;
        align-items: flex-start;
      }

      .client-info-header h2 {
        font-size: 2rem;
      }

      .badge {
        font-size: 0.7rem;
      }

      .tracker-steps {
        flex-direction: row;
        justify-content: space-between;
        margin: 40px 0;
      }

      .tracker-steps::before {
        content: '';
        position: absolute;
        top: 15px;
        left: 0;
        right: 0;
        height: 2px;
        background: var(--border-color);
        z-index: 1;
      }

      .tracker-progress-line {
        display: block;
        position: absolute;
        top: 15px;
        left: 0;
        height: 2px;
        background: var(--accent-gold);
        z-index: 2;
        transition: width 0.5s ease;
      }

      .step-item {
        flex-direction: column;
        justify-content: center;
        text-align: center;
        flex: 1;
        gap: 0;
      }

      .step-circle {
        margin: 0 auto 12px;
      }

      .step-title {
        font-size: 0.7rem;
      }

      .details-grid {
        grid-template-columns: 1fr 1fr;
        gap: 20px;
        padding: 24px;
      }
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="header">
      <p>Canon Moments</p>
      <h1>Editing & Status Portal</h1>
    </div>

    <div class="search-card">
      <label for="searchInput">Enter Your Email Address</label>
      <div class="search-box">
        <input type="text" id="searchInput" class="search-input" placeholder="e.g. youlookamazing@gmail.com" onkeypress="handleKeyPress(event)">
        <button class="btn" onclick="checkStatus()">Check Progress</button>
      </div>
      <div id="loader" class="loader">Fetching status...</div>
      <p id="errorMsg" style="color: #e57373; font-size: 0.8rem; margin-top: 12px; text-align: center; display: none;"></p>
    </div>

    <div id="statusCard" class="status-card">
      <div class="client-info-header">
        <div>
          <h2 id="clientName">Client Name</h2>
          <p id="sessionType">Portrait Session</p>
        </div>
        <div class="badge" id="currentStageBadge">In Progress</div>
      </div>

      <div class="tracker-steps">
        <div class="tracker-progress-line" id="progressLine"></div>
        <div class="step-item" id="step1">
          <div class="step-circle">1</div>
          <div class="step-title">Queued</div>
        </div>
        <div class="step-item" id="step2">
          <div class="step-circle">2</div>
          <div class="step-title">Selection</div>
        </div>
        <div class="step-item" id="step3">
          <div class="step-circle">3</div>
          <div class="step-title">Color Grade</div>
        </div>
        <div class="step-item" id="step4">
          <div class="step-circle">4</div>
          <div class="step-title">Retouching</div>
        </div>
        <div class="step-item" id="step5">
          <div class="step-circle">5</div>
          <div class="step-title">Photos Uploading</div>
        </div>
        <div class="step-item" id="step6">
          <div class="step-circle">6</div>
          <div class="step-title">Gallery Delivery</div>
        </div>
      </div>

      <div class="details-grid">
        <div class="detail-item">
          <h4>Estimated Delivery</h4>
          <p id="estDelivery">-</p>
        </div>
        <div class="detail-item">
          <h4>Studio Note</h4>
          <p id="studioNote">-</p>
        </div>
      </div>
    </div>
  </div>

  <script>
    const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzOGZKUTzD_BR1XbU5tkJAlWkfyqR2iQeYr-k6_flz9es6yfutJoNSswNIPupPZLZYZ/exec";

    function handleKeyPress(e) {
      if (e.key === 'Enter') {
        checkStatus();
      }
    }

    async function checkStatus() {
      const searchInput = document.getElementById('searchInput').value.trim().toLowerCase();
      const errorMsg = document.getElementById('errorMsg');
      const statusCard = document.getElementById('statusCard');
      const loader = document.getElementById('loader');

      if (!searchInput) {
        errorMsg.innerText = "Please enter an email address.";
        errorMsg.style.display = "block";
        statusCard.style.display = "none";
        return;
      }

      errorMsg.style.display = "none";
      loader.style.display = "block";
      statusCard.style.display = "none";

      try {
        const response = await fetch(`${GOOGLE_SCRIPT_URL}?email=${encodeURIComponent(searchInput)}`);
        const data = await response.json();

        loader.style.display = "none";

        if (data.found) {
          renderOrderData(data);
          statusCard.style.display = "block";
        } else {
          errorMsg.innerText = "No active project found with that email address.";
          errorMsg.style.display = "block";
        }
      } catch (err) {
        console.error(err);
        loader.style.display = "none";
        errorMsg.innerText = "Error connecting to status server. Please try again later.";
        errorMsg.style.display = "block";
      }
    }

    function renderOrderData(data) {
      document.getElementById('clientName').innerText = data.name || "Client";
      document.getElementById('sessionType').innerText = data.session || "Photography Session";

      let deliveryText = data.estDelivery;
      if (typeof deliveryText === 'string' && deliveryText.includes('T')) {
        deliveryText = deliveryText.split('T')[0];
      }
      document.getElementById('estDelivery').innerText = deliveryText || "TBD";
      
      document.getElementById('studioNote').innerText = data.note || "No specific notes at this time.";

      updateTrackerVisuals(data.stage || 1);
    }

    function updateTrackerVisuals(stage) {
      const stageNames = ["Queued", "Photo Selection", "Color Grading", "Detail Retouching", "Uploading Photos", "Gallery Delivered"];
      document.getElementById('currentStageBadge').innerText = stageNames[stage - 1] || "Queued";

      for (let i = 1; i <= 6; i++) {
        const step = document.getElementById(`step${i}`);
        if (step) {
          step.classList.remove('active', 'completed');
          if (i < stage) {
            step.classList.add('completed');
          } else if (i === stage) {
            step.classList.add('active');
          }
        }
      }

      const progressPercent = Math.min(Math.max(((stage - 1) / 5) * 100, 0), 100);
      const progressLine = document.getElementById('progressLine');
      if (progressLine) {
        progressLine.style.width = `${progressPercent}%`;
      }
    }
  </script>
</body>
</html>
